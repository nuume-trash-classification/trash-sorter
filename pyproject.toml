[project]
name = "trash-sorter"
version = "0.1.0"
description = "Isaac Sim conveyor-belt trash sorter: synthetic data, YOLO-seg perception, UR10 suction picking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Training / evaluation / live demo. Pulls CUDA torch from the PyTorch index (see [tool.uv.sources]).
ml = [
    "torch>=2.6",
    "torchvision>=0.21",
    "ultralytics>=8.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["N806", "N803", "E402"]  # math-style names (R, T, K) and imports after SimulationApp start
